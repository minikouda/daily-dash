[project]
name = "daily-dash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shizhe" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=1.2",
    "tracking-numbers>=0.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
daily-dash = "daily_dash:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
